name: Verify credentials

on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:        # "Run automated checks now" in the app, or the Actions tab

concurrency:
  group: verify-credentials
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: verifier/requirements.txt
      - run: pip install -r verifier/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check pending and due credentials
        run: python -m verifier.run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVIDENCE_DIR: ${{ runner.temp }}/evidence
          AUTO_CONFIRM: ${{ vars.AUTO_CONFIRM || 'true' }}
          RECHECK_DAYS: ${{ vars.RECHECK_DAYS || '30' }}
          LOCATOR_BRANDS: ${{ vars.LOCATOR_BRANDS || '' }}
